<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棚卸しチェック表</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>棚卸しチェック表</h1>
    <div class="month">
      <label for="month">対象月</label>
      <input type="month" id="month">
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <main>
    <section class="source no-print" id="source">
      <div class="source-status" id="sourceStatus"></div>
      <div class="source-actions">
        <button id="reload" class="primary" hidden>エクセルを読み込む</button>
        <button id="pickFolder">フォルダを登録</button>
        <label class="button">ファイルを直接選択<input type="file" id="pickFile" accept=".xlsx" hidden></label>
      </div>
      <p class="source-message" id="sourceMessage" hidden></p>
    </section>

    <section class="toolbar no-print">
      <input type="search" id="search" placeholder="名称・用途・場所で検索">
      <label class="inline"><input type="checkbox" id="showExcluded"> 対象外も表示</label>
    </section>

    <table class="sheet">
      <thead>
        <tr>
          <th class="col-check">確認</th>
          <th>名称</th>
          <th>場所</th>
          <th class="num">前月</th>
          <th class="num">今月数量</th>
          <th class="num">増減</th>
          <th>メモ</th>
          <th class="no-print"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden></p>

    <section class="toolbar bottom no-print">
      <button id="exportCsv">CSV出力（対象月）</button>
      <button id="print">印刷</button>
      <span class="spacer"></span>
      <button id="backup">バックアップ保存</button>
      <label class="button">バックアップ復元<input type="file" id="restore" accept="application/json" hidden></label>
    </section>
  </main>

  <dialog id="itemDialog">
    <form method="dialog" id="itemForm">
      <h2 id="dialogTitle"></h2>
      <dl class="excel-fields" id="excelFields"></dl>
      <div class="photos" id="photos"></div>
      <p class="hint">上の内容はエクセルから読み込んでいます。変更はエクセル側で行ってください。</p>
      <div class="row2">
        <label>単位 <input name="unit" placeholder="例: 箱 / 個 / 袋"></label>
        <label>最低在庫数 <input name="minQty" type="number" min="0" step="1" placeholder="未設定"></label>
      </div>
      <label class="inline"><input type="checkbox" name="excluded"> 棚卸しの対象外にする（設備など数えないもの）</label>
      <div class="dialog-actions">
        <button type="button" id="forgetItem" class="danger" hidden>この品目を削除</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>キャンセル</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/xlsx-reader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
